# Regenerates the release factory's certified core with the compiler PrismPM now vendors (LexLean 0.4.3 on Lean
# 4.32.2), for review. The method of #652: the admitted vendored compiler relocks and verifies the factory model,
# binds only the production request's target descriptor digests from its own `production targets`, rebuilds the
# certified bundle, replays it, and runs prism-factory/check.sh. Roots, target IDs, package names and versions and the
# model sources stay exact; the run fails otherwise. It uploads the bundle, the lock and the request for import.
name: Factory compiler binding regeneration
on:
  push:
    branches: [claude/factory-lexlean-0-4-3]
    paths: [.github/workflows/factory-binding-regenerate.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: factory-binding-regenerate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install the repository-pinned Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          export ELAN_HOME="$RUNNER_TEMP/factory-elan"
          curl --fail --location --retry 3 https://github.com/leanprover/elan/releases/download/v4.2.3/elan-x86_64-unknown-linux-gnu.tar.gz -o "$RUNNER_TEMP/elan.tar.gz"
          echo "df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2  $RUNNER_TEMP/elan.tar.gz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/elan-installer"
          tar -xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP/elan-installer"
          "$RUNNER_TEMP/elan-installer/elan-init" -y --no-modify-path --default-toolchain none
          toolchain=$(cat prism-factory/model/lean-toolchain)
          test "$toolchain" = "leanprover/lean4:v4.32.2"
          "$ELAN_HOME/bin/elan" toolchain install "$toolchain"
          echo "ELAN_HOME=$ELAN_HOME" >> "$GITHUB_ENV"
          echo "$ELAN_HOME/bin" >> "$GITHUB_PATH"
      - name: Regenerate through the admitted compiler and original production owner
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/factory-binding"
          mkdir -p "$out"
          git rev-parse HEAD > "$out/source.txt"
          sha256sum vendor/lexlean/MANIFEST.sha256 vendor/lexlean/lexlean-0.4.3.crate > "$out/compiler-package.sha256"
          cat vendor/lexlean/.cargo_vcs_info.json > "$out/compiler-vcs.json"
          cargo build --release --locked --manifest-path vendor/lexlean/Cargo.toml --bin lexlean --target-dir "$PWD/target/lexlean"
          lexlean="$PWD/target/lexlean/release/lexlean"
          "$lexlean" --version | tee "$out/compiler-version.txt"
          # The bundle in the tree was produced by an earlier compiler: it must be refused, and how is recorded.
          if "$lexlean" production verify-artifact prism-factory/certified > "$out/baseline-replay.log" 2>&1; then
            echo "Expected the earlier compiler's bundle to be refused" >&2
            exit 1
          fi
          cat "$out/baseline-replay.log"
          "$lexlean" production targets > "$out/targets.json"
          (cd prism-factory/model && "$lexlean" lock && "$lexlean" lock --check && "$lexlean" verify --all) 2>&1 | tee "$out/model-verification.log"
          (cd prism-factory/model && "$lexlean" production build --request ../production-request.json) > "$out/baseline-request.log" 2>&1 || true
          cat "$out/baseline-request.log"
          # Bind only existing target references from the current compiler's canonical descriptor document. No digest is
          # supplied by this writer, and everything else in the request is asserted unchanged.
          python3 - "$out/targets.json" prism-factory/production-request.json <<'PY'
          import copy, json, sys
          from pathlib import Path
          descriptors = json.loads(Path(sys.argv[1]).read_text())
          assert descriptors["spec"] == "lexlean/target-descriptors/1"
          targets = {target["id"]: target for target in descriptors["targets"]}
          assert len(targets) == len(descriptors["targets"])
          path = Path(sys.argv[2])
          request = json.loads(path.read_text())
          original = copy.deepcopy(request)
          assert request["spec"] == "lexlean/production-request/1"
          for root in request["roots"]:
              for target in root["targets"]:
                  target["digest"] = targets[target["id"]]["digest"]
          neutral = copy.deepcopy(request)
          for before, after in zip(original["roots"], neutral["roots"], strict=True):
              for old, new in zip(before["targets"], after["targets"], strict=True):
                  new["digest"] = old["digest"]
          assert neutral == original
          path.write_text(json.dumps(request, indent=2, sort_keys=True) + "\n")
          PY
          (cd prism-factory/model && "$lexlean" production build --request ../production-request.json) 2>&1 | tee "$out/production-build.log"
          result=$(sed -n 's/.*; result \([0-9a-f]\{64\}\);.*/\1/p' "$out/production-build.log")
          test "${#result}" = 64
          test -f "prism-factory/model/.lexlean/production/$result/result.json"
          mv prism-factory/certified "$RUNNER_TEMP/original-certified"
          cp -a "prism-factory/model/.lexlean/production/$result" prism-factory/certified
          "$lexlean" production verify-artifact prism-factory/certified 2>&1 | tee "$out/fresh-replay.log"
          bash prism-factory/check.sh 2>&1 | tee "$out/factory-check.log"
          git diff --exit-code -- .github/workflows/release.yml .github/workflows/factory.yml prism-factory/model/src prism-factory/std vendor/lexlean
          git add -N -- prism-factory/certified
          git diff --check
          git diff --binary HEAD -- prism-factory/model/lexlean.lock prism-factory/production-request.json prism-factory/certified > "$out/generated.patch"
          cp prism-factory/model/lexlean.lock "$out/lexlean.lock"
          cp prism-factory/production-request.json "$out/production-request.json"
          cp -a prism-factory/certified "$out/certified"
          (cd "$out" && find certified -type f -print0 | sort -z | xargs -0 sha256sum > bundle.sha256)
          (cd "$out" && sha256sum generated.patch lexlean.lock production-request.json source.txt compiler-vcs.json compiler-package.sha256 > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: factory-binding-${{ github.run_id }}
          path: ${{ runner.temp }}/factory-binding/
          if-no-files-found: error
          retention-days: 30
