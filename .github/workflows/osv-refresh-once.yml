# One-off, for review: refreshes the locked OSV database snapshots by the recipe of fd84a89c (the pins of
# model/osv-databases.json expired 2026-11-19 and the installed SDK's fetch --locked now gets 404). It uploads the
# changed tracked files as a patch for import; it commits nothing.
name: OSV snapshot refresh (one-off)
on:
  push:
    branches: [claude/rebind-browser-system]
    paths: [.github/workflows/osv-refresh-once.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Make room for five OSV databases (the script requires 12 GiB free)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h .
      - name: Refresh by the recorded recipe
        shell: bash
        run: |
          set -euo pipefail
          node scripts/refresh-osv.mjs acquire
          node scripts/refresh-osv.mjs apply
          cargo build --locked --release --package prismpm
          target/release/prismpm --json --project . authority resolve
          cargo xtask validate-model --write
          git status --short
          git diff --stat
          git diff --exit-code -- . ':!model/osv-databases.json' ':!model/authorities.toml' ':!standards.lock' ':!CONFORMANCE.md' || { echo "a file outside the recipe's four changed" >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/osv"
          git diff --binary > "$RUNNER_TEMP/osv/osv-refresh.patch"
          cp model/osv-databases.json "$RUNNER_TEMP/osv/"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: osv-refresh-${{ github.run_id }}
          path: ${{ runner.temp }}/osv/
          if-no-files-found: error
          retention-days: 7
