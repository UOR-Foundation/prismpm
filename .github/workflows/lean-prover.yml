name: lean prover

# The WASM Lean prover in sdk/npm/lean-prover: Lean 4.32.2's elaborator and kernel as WebAssembly, so a Prism SDK
# build proves its model in Node with no hosted server and no Docker.
#
# - unit: the Node entry, blob admission, the axiom audit, the store and the gate's rules, without the engine.
# - spec: the prover's specs (spec/) and the gate's committed corpus project are LexLean source, and Lean proves
#   every declaration with the release LexLean 0.4.3 and elan's Lean 4.32.2; a planted weaker axiom policy is
#   refused with LLV7005.
# - engine: the engine build, cached by the BLAKE3 label of its inputs (build/engine-label.mjs). It reruns only when
#   the Lean commit, the patch, Emscripten, the driver, a dependency pin or a build script changes.
# - gate: the engine equals native Lean on every corpus declaration, and every planted defect is refused. Its
#   attestation names the engine, library, LexLean and corpus labels.
# - engine32, gate32: the same for the 32-bit engine, which browsers without 64-bit WebAssembly memory run (Safari
#   before 27.3, every iOS browser). Its Init is compiled by lean32 and admitted only when every Init declaration
#   equals the release's. Cached by its own label (build/engine-label.mjs 32).
# - browsers, safari: Chromium, Firefox, WebKit, Safari and Mobile Safari (iOS Simulator) each run the gate's browser
#   corpus with the gated builds, and record agreement, cold and warm time and peak engine memory.
#
# No container image is pulled: every tool is fetched by its pin and checked before use.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - sdk/npm/lean-prover/**
      - sdk/npm/prism-code/src/blake3.mjs
      - tools.lock
      - .github/workflows/lean-prover.yml
  push:
    branches: [main]
    paths:
      - sdk/npm/lean-prover/**
      - sdk/npm/prism-code/src/blake3.mjs
      - tools.lock
      - .github/workflows/lean-prover.yml

permissions:
  contents: read

concurrency:
  group: lean-prover-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: sdk/npm/lean-prover

jobs:
  unit:
    name: unit tests on node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  spec:
    name: Lean proves the specs
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Name the work folder
        run: echo "WORK=$RUNNER_TEMP/lean-prover" >> "$GITHUB_ENV"
      - name: Fetch elan, Lean 4.32.2 and LexLean 0.4.3 by their pins
        run: |
          set -euo pipefail
          TOOLS=lean bash build/fetch-tools.sh
          mkdir -p "$WORK/lexlean"
          url=$(python3 -c 'import json; print(json.load(open("engine.lock.json"))["lexlean"]["binaries"]["url"])')
          sha=$(python3 -c 'import json; print(json.load(open("engine.lock.json"))["lexlean"]["binaries"]["sha256"])')
          curl -fsSL "$url" -o "$WORK/lexlean/binaries.tar.gz"
          echo "$sha  $WORK/lexlean/binaries.tar.gz" | sha256sum -c -
          tar -xzf "$WORK/lexlean/binaries.tar.gz" -C "$WORK/lexlean"
          echo "$WORK/lexlean/bin/x86_64-unknown-linux-gnu" >> "$GITHUB_PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: The locks are current and Lean proves every declaration
        run: |
          set -euo pipefail
          for project in spec gate/corpus/leap; do
            ( cd "$project" && lexlean lock && lexlean fmt --all && lexlean lock && lexlean verify --all ) | tee verify.log
            grep -q '^verified ' verify.log
            rm verify.log
          done
          git diff --exit-code -- .
      - name: "Planted defect: a weaker axiom policy is refused with LLV7005"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          path = 'spec/src/BlobLabel.lex.tex'
          text = open(path, encoding='utf8').read()
          start = text.index('name: admittedOnlyWhenTheDecodedLabelIsTheManifests')
          sound = 'axioms: [Classical.choice, Quot.sound, propext]'
          at = text.index(sound, start)
          open(path, 'w', encoding='utf8', newline='\n').write(text[:at] + 'axioms: [Quot.sound, propext]' + text[at + len(sound):])
          PY
          ! git diff --quiet -- spec/src/BlobLabel.lex.tex
          set +e
          ( cd spec && lexlean lock && lexlean verify --all ) > defect.log 2>&1
          code=$?
          set -e
          cat defect.log
          [ "$code" -ne 0 ]
          grep -q 'LLV7005' defect.log
          ! grep -q '^verified' defect.log
          rm defect.log
          git checkout -- .

  engine:
    name: engine (cached by BLAKE3 label)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      label: ${{ steps.label.outputs.label }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Name the work folder
        run: echo "WORK=$RUNNER_TEMP/lean-prover" >> "$GITHUB_ENV"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: The pinned patch, and the engine's label
        id: label
        run: |
          set -euo pipefail
          node build/check-pins.mjs patch
          label=$(node build/engine-label.mjs)
          echo "label=$label" >> "$GITHUB_OUTPUT"
          echo "engine inputs: $label"
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        id: cache
        with:
          path: |
            ${{ runner.temp }}/lean-prover/dist
            ${{ runner.temp }}/lean-prover/driver/.lake/build/bin/elab
          key: lean-prover-engine-${{ steps.label.outputs.label }}
      - name: Make room for the build
        if: steps.cache.outputs.cache-hit != 'true'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Build the engine
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          JOBS: '4'
        run: bash build/build-engine.sh
      - uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          path: |
            ${{ runner.temp }}/lean-prover/dist
            ${{ runner.temp }}/lean-prover/driver/.lake/build/bin/elab
          key: lean-prover-engine-${{ steps.label.outputs.label }}
      - name: Keep the engine
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lean-prover-engine
          path: ${{ runner.temp }}/lean-prover/dist
          if-no-files-found: error

  gate:
    name: corpus gate (WASM equals native)
    needs: engine
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Name the work folder
        run: echo "WORK=$RUNNER_TEMP/lean-prover" >> "$GITHUB_ENV"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ${{ runner.temp }}/lean-prover/dist
            ${{ runner.temp }}/lean-prover/driver/.lake/build/bin/elab
          key: lean-prover-engine-${{ needs.engine.outputs.label }}
          fail-on-cache-miss: true
      - name: Fetch elan and Lean 4.32.2
        run: TOOLS=lean bash build/fetch-tools.sh
      - name: The engine agrees with native Lean on every corpus declaration; every planted defect is refused
        run: bash gate/run-gate.sh
      # The same engine and manifest under Node 22, the oldest Node prism-code supports, and inside a 4 GiB memory
      # cap, the cloud-sandbox profile: a cgroup (systemd-run, MemoryMax=4G, no swap) on the runner, no container.
      # Memory64, wasm exceptions, the 8 GB memory maximum and the worker's deep stack must all hold there,
      # declaration for declaration. A run the cap kills exits 137, and the step says so.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Under Node 22 and a 4 GiB cap, the engine agrees with native Lean
        run: |
          set -euo pipefail
          g=$WORK/gate
          node --version | tee "$g/node22-version.txt"
          mapfile -t specs < "$g/corpus.txt"
          set +e
          sudo systemd-run --scope --quiet -p MemoryMax=4G -p MemorySwapMax=0 --uid="$(id -u)" --gid="$(id -g)" -- \
            "$(command -v node)" "$PWD/gate/run-wasm.mjs" "$g/manifest" --store "$g/store-node22" \
            --timings "$g/timing-node22-cap4g.json" "${specs[@]}" > "$g/wasm-node22.jsonl"
          code=$?
          set -e
          echo "exit $code" | tee "$g/node22-cap4g-exit.txt"
          [ "$code" -ne 137 ] || { echo "::error::the engine was killed by the 4 GiB cap under Node 22"; exit 1; }
          [ "$code" -eq 0 ]
          node gate/agree.mjs "$g/native.jsonl" "$g/wasm-node22.jsonl" | tee "$g/agree-node22.txt"
      - name: The speed record
        if: always()
        run: |
          g=$WORK/gate
          node gate/speed.mjs "$g/speed.json" native="$g/time-native.txt" wasm-cold="$g/timing-wasm-cold.json" \
            wasm-warm="$g/timing-wasm-warm.json" node22-cap4g="$g/timing-node22-cap4g.json" | tee "$g/speed.txt"
      # The manifest (lean-wasm-prover/1) and every blob gzip-encoded under the BLAKE3 label of its decoded bytes:
      # the engine, its loader, LexLean's WASI build, Init and LexLean's runtime. A tab or a Node host loads it as is.
      - name: Keep the manifest and its blobs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lean-prover-library
          path: ${{ runner.temp }}/lean-prover/gate/manifest
          if-no-files-found: warn
          compression-level: 0
      # The npm packages of the same manifest: shards named by the BLAKE3 label of their content, and the library
      # package named by the label of its manifest. Packed, not published.
      - name: Keep the npm packages
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lean-prover-npm
          path: |
            ${{ runner.temp }}/lean-prover/gate/npm/tarballs
            ${{ runner.temp }}/lean-prover/gate/npm/npm-packages.json
            ${{ runner.temp }}/lean-prover/gate/npm/npm-sizes.json
          if-no-files-found: warn
          compression-level: 0
      - name: Keep the browser corpus
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lean-prover-browser-corpus
          path: ${{ runner.temp }}/lean-prover/gate/browser-corpus
          if-no-files-found: warn
      - name: Keep the gate's evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lean-prover-gate
          path: |
            ${{ runner.temp }}/lean-prover/gate/*.jsonl
            ${{ runner.temp }}/lean-prover/gate/*.json
            ${{ runner.temp }}/lean-prover/gate/*.txt
          if-no-files-found: warn

  engine32:
    name: 32-bit engine and Init (cached by BLAKE3 label)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      label: ${{ steps.label.outputs.label }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # Under /home: lean32 sees only /home and /tmp of the host (Lean's util/shell.cpp under Emscripten).
      - name: Name the work folder
        run: echo "WORK=$RUNNER_TEMP/lean-prover" >> "$GITHUB_ENV"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      # The key: every input of the 64-bit engine, the 32-bit scripts and the width (build/engine-label.mjs 32).
      - name: The pinned patch, and the 32-bit engine's label
        id: label
        run: |
          set -euo pipefail
          node build/check-pins.mjs patch
          label=$(node build/engine-label.mjs 32)
          echo "label=$label" >> "$GITHUB_OUTPUT"
          echo "32-bit engine inputs: $label"
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        id: cache
        with:
          path: |
            ${{ runner.temp }}/lean-prover/dist32
            ${{ runner.temp }}/lean-prover/sys32/lib/lean
            ${{ runner.temp }}/lean-prover/lean32
            ${{ runner.temp }}/lean-prover/driver/.lake/build/bin/elab
          key: lean-prover-engine32-${{ steps.label.outputs.label }}
      - name: Make room for the build
        if: steps.cache.outputs.cache-hit != 'true'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Build the 32-bit engine, lean32 and the Init lean32 compiles
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          JOBS: '4'
        run: bash build/build-engine32.sh
      - uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          path: |
            ${{ runner.temp }}/lean-prover/dist32
            ${{ runner.temp }}/lean-prover/sys32/lib/lean
            ${{ runner.temp }}/lean-prover/lean32
            ${{ runner.temp }}/lean-prover/driver/.lake/build/bin/elab
          key: lean-prover-engine32-${{ steps.label.outputs.label }}
      - name: Keep the 32-bit engine
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lean-prover-engine32
          path: ${{ runner.temp }}/lean-prover/dist32
          if-no-files-found: error

  gate32:
    name: 32-bit corpus gate (its Init and every corpus declaration equal native)
    needs: engine32
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Name the work folder
        run: echo "WORK=$RUNNER_TEMP/lean-prover" >> "$GITHUB_ENV"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ${{ runner.temp }}/lean-prover/dist32
            ${{ runner.temp }}/lean-prover/sys32/lib/lean
            ${{ runner.temp }}/lean-prover/lean32
            ${{ runner.temp }}/lean-prover/driver/.lake/build/bin/elab
          key: lean-prover-engine32-${{ needs.engine32.outputs.label }}
          fail-on-cache-miss: true
      - name: Fetch elan and Lean 4.32.2
        run: TOOLS=lean bash build/fetch-tools.sh
      # lean32 compiles LexLean's runtime for the 32-bit library; the sysroot's bin/lean runs it under Node.
      - name: The sysroot lean32 serves
        run: bash build/sysroot32.sh
      - name: The 32-bit Init equals the release's; the engine agrees with native Lean on every corpus declaration
        env:
          WIDTH: '32'
        run: bash gate/run-gate.sh
      - name: Keep the 32-bit manifest and its blobs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lean-prover-library-32
          path: ${{ runner.temp }}/lean-prover/gate32/manifest
          if-no-files-found: warn
          compression-level: 0
      - name: Keep the 32-bit gate's evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lean-prover-gate-32
          path: |
            ${{ runner.temp }}/lean-prover/gate32/*.jsonl
            ${{ runner.temp }}/lean-prover/gate32/*.json
            ${{ runner.temp }}/lean-prover/gate32/*.txt
          if-no-files-found: warn

  browsers:
    name: Chromium, Firefox and WebKit run the gated builds
    needs: [gate, gate32]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: lean-prover-library
          path: ${{ runner.temp }}/lib
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: lean-prover-library-32
          path: ${{ runner.temp }}/lib32
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: lean-prover-browser-corpus
          path: ${{ runner.temp }}/corpus
      # Playwright at the version sdk/oracles pins; each Playwright release pins its browser builds.
      - name: Playwright 1.62.1 and its browsers
        run: |
          set -euo pipefail
          npm install --no-save --prefix "$RUNNER_TEMP/pw" playwright@1.62.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium firefox webkit
      - name: Each engine runs the corpus cold and warm, with the build it chooses and the 32-bit one
        run: |
          set -euo pipefail
          node web/serve.mjs "$RUNNER_TEMP/lib" "$RUNNER_TEMP/corpus" 8794 --lib32 "$RUNNER_TEMP/lib32" &
          sleep 2
          node gate/browsers.mjs --playwright "$RUNNER_TEMP/pw" --url http://localhost:8794 --out "$RUNNER_TEMP/browsers.json"
          node gate/browsers.mjs --table "$RUNNER_TEMP/browsers.json" >> "$GITHUB_STEP_SUMMARY"
          node gate/browsers.mjs --all-work "$RUNNER_TEMP/browsers.json"
      - name: Keep the record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lean-prover-browsers
          path: ${{ runner.temp }}/browsers.json
          if-no-files-found: warn

  safari:
    name: Safari on macOS and Mobile Safari in the iOS Simulator
    needs: [gate, gate32]
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: lean-prover-library
          path: ${{ runner.temp }}/lib
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: lean-prover-library-32
          path: ${{ runner.temp }}/lib32
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: lean-prover-browser-corpus
          path: ${{ runner.temp }}/corpus
      - name: Safari and Mobile Safari run the corpus cold and warm, with the build each chooses
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/reports"
          node web/serve.mjs "$RUNNER_TEMP/lib" "$RUNNER_TEMP/corpus" 8794 --lib32 "$RUNNER_TEMP/lib32" --reports "$RUNNER_TEMP/reports" &
          sleep 2
          node gate/safari.mjs --url http://localhost:8794 --reports "$RUNNER_TEMP/reports" --out "$RUNNER_TEMP/safari.json"
          node gate/safari.mjs --url http://localhost:8794 --reports "$RUNNER_TEMP/reports" --out "$RUNNER_TEMP/ios.json" --ios
          node gate/browsers.mjs --table "$RUNNER_TEMP/safari.json" "$RUNNER_TEMP/ios.json" >> "$GITHUB_STEP_SUMMARY"
          node gate/browsers.mjs --all-work "$RUNNER_TEMP/safari.json" "$RUNNER_TEMP/ios.json"
      - name: Keep the record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lean-prover-safari
          path: |
            ${{ runner.temp }}/safari.json
            ${{ runner.temp }}/ios.json
            ${{ runner.temp }}/reports
          if-no-files-found: warn
